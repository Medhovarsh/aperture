[project]
name = "aperture-plane"
version = "0.1.0"
description = "Governed context plane for AI agents - permissioned, purpose-bound, auditable retrieval over MCP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "httpx>=0.27", "fastapi>=0.110"]

[project.scripts]
aperture = "aperture.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aperture"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
