name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # The plane is deployed on Windows and macOS too; path handling and the
          # stdio transport are the parts most likely to differ.
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

  acceptance:
    name: acceptance walkthrough
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Build the demo workspace
        run: aperture demo --path ci_workspace

      - name: Governance config must validate
        run: aperture lint -w ci_workspace

      - name: Purpose binding must hold end to end
        run: |
          set -euo pipefail
          # HR acting for HR support reaches the handbook.
          aperture query -w ci_workspace -p u_dana --purpose hr_support \
            "how much parental leave do we offer" --json > hr.json
          python -c "
          import json, sys
          data = json.load(open('hr.json'))
          assert data['records'], 'HR principal should reach the handbook'
          assert data['records'][0]['source_id'] == 'hr_handbook', data['records'][0]
          "

          # The same question under a support purpose must not reach it.
          aperture query -w ci_workspace -p u_kim --purpose customer_support \
            "how much parental leave do we offer" --json > support.json
          python -c "
          import json
          data = json.load(open('support.json'))
          sources = {r['source_id'] for r in data['records']}
          assert 'hr_handbook' not in sources, sources
          assert data['withheld'], 'withheld records must be reported, not hidden'
          "

      - name: Action governance must hold end to end
        run: |
          set -euo pipefail
          AGENT="-p svc_support_agent --purpose customer_support"

          # A refund beyond every grant is refused, and nothing is written.
          if aperture actions -w ci_workspace propose support.refund $AGENT \
              --arg customer_id=cus-4471 --arg amount=9000; then
            echo "an over-limit refund was accepted" && exit 1
          fi

          # Read authority must not grant action authority.
          if aperture actions -w ci_workspace propose support.refund \
              -p u_dana --purpose customer_support \
              --arg customer_id=cus-4471 --arg amount=10; then
            echo "read access granted action authority" && exit 1
          fi

          # A large refund needs a human, and the proposer is not one.
          aperture actions -w ci_workspace propose support.refund $AGENT \
            --arg customer_id=cus-4471 --arg amount=3000
          PROPOSAL=$(aperture actions -w ci_workspace pending | grep -o 'prp_[a-f0-9]*' | head -1)
          if aperture actions -w ci_workspace approve "$PROPOSAL" --as svc_support_agent; then
            echo "an agent approved its own action" && exit 1
          fi
          aperture actions -w ci_workspace approve "$PROPOSAL" --as u_kim
          aperture actions -w ci_workspace execute "$PROPOSAL" -p svc_support_agent

      - name: Lineage chain must verify
        run: aperture lineage -w ci_workspace verify

  mcp-contract:
    name: MCP stdio handshake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Serve and complete a handshake over stdio
        run: |
          set -euo pipefail
          aperture demo --path ci_workspace
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
          | aperture serve -w ci_workspace -p svc_support_agent --purpose customer_support \
          | python -c "
          import json, sys
          messages = [json.loads(line) for line in sys.stdin]
          assert messages[0]['result']['serverInfo']['name'] == 'aperture'
          names = {tool['name'] for tool in messages[1]['result']['tools']}
          expected = {
              'context_search', 'context_fetch', 'catalog_list_sources', 'access_explain',
              'action_list', 'action_propose', 'action_execute', 'action_status',
          }
          assert names == expected, names
          # Approval must never be reachable from anything a prompt can influence.
          forbidden = {'action_approve', 'action_deny', 'action_decide', 'action_rollback'}
          assert not (names & forbidden), names & forbidden
          print('MCP contract OK:', sorted(names))
          "

  production-controls:
    name: production controls
    runs-on: ubuntu-latest
    env:
      APERTURE_SIGNING_SECRET: ci-signing-secret-long-enough
      APERTURE_ANCHOR_SECRET: ci-anchor-secret-long-enough
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Build workspace
        run: aperture demo --path ci_workspace

      - name: Rolling-window budget must stop a retry loop
        run: |
          set -euo pipefail
          executed=0
          for i in 1 2 3 4 5 6 7; do
            if aperture actions -w ci_workspace propose support.refund \
                -p svc_support_agent --purpose customer_support \
                --arg customer_id=cus-5510 --arg amount=90 > proposal.txt 2>/dev/null; then
              PID=$(grep -o 'prp_[a-f0-9]*' proposal.txt | head -1)
              aperture actions -w ci_workspace execute "$PID" -p svc_support_agent > /dev/null
              executed=$((executed + 1))
            fi
          done
          echo "executed $executed of 7 attempts"
          # 5 x 90 = 450 USD; a sixth would breach the 500 USD hourly ceiling.
          test "$executed" -eq 5 || { echo "budget ceiling not enforced"; exit 1; }

      - name: Signed assertions must be single use
        run: |
          set -euo pipefail
          TOKEN=$(aperture assertion -p u_kim --purpose customer_support)
          python - "$TOKEN" <<'PYCHECK' > requests.jsonl
          import json, sys
          token = sys.argv[1]
          for message_id in (1, 2):
              print(json.dumps({
                  "jsonrpc": "2.0",
                  "id": message_id,
                  "method": "tools/call",
                  "params": {
                      "name": "context_search",
                      "arguments": {"question": "refund window", "assertion": token},
                  },
              }))
          PYCHECK
          aperture serve -w ci_workspace -p unused \
            --signing-secret-env APERTURE_SIGNING_SECRET < requests.jsonl > replies.jsonl
          python - <<'PYCHECK'
          import json
          replies = [json.loads(line) for line in open("replies.jsonl")]
          first, second = (json.loads(r["result"]["content"][0]["text"]) for r in replies)
          assert "error" not in first, first
          assert "assertion_replayed" in second.get("error", ""), second
          print("single-use assertions OK")
          PYCHECK

      - name: Anchored audit log must detect a wholesale rewrite
        run: |
          set -euo pipefail
          aperture lineage -w ci_workspace checkpoint --secret-env APERTURE_ANCHOR_SECRET
          aperture lineage -w ci_workspace verify --secret-env APERTURE_ANCHOR_SECRET
          : > ci_workspace/lineage/access.jsonl
          if aperture lineage -w ci_workspace verify --secret-env APERTURE_ANCHOR_SECRET; then
            echo "a rewritten log still verified" && exit 1
          fi
          echo "rewrite detected"

  container:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t aperture:ci .

      - name: The image must run as a non-root user
        run: |
          set -euo pipefail
          user=$(docker run --rm aperture:ci id -un)
          echo "container user: $user"
          test "$user" = "aperture" || { echo "image runs as $user"; exit 1; }

      - name: Serve and answer both probes
        run: |
          set -euo pipefail
          docker run -d --name aperture-ci -p 8000:8000 aperture:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz > /dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/healthz
          curl -fsS http://localhost:8000/readyz -o readyz.json
          cat readyz.json
          python - <<'PYCHECK'
          import json
          body = json.load(open("readyz.json"))
          assert body["ready"] is True, body
          assert body["lineage_chain_intact"] is True, body
          print("container serves a governed request")
          PYCHECK

      - name: Metrics endpoint must expose Prometheus text
        run: |
          set -euo pipefail
          curl -fsS -X POST http://localhost:8000/api/search \
            -H 'Content-Type: application/json' \
            -d '{"principal_id":"u_kim","purpose":"customer_support","question":"refund window"}' \
            -o /dev/null
          curl -fsS http://localhost:8000/metrics | grep aperture_searches_total

      - name: The MCP server must run in the same image
        run: |
          set -euo pipefail
          docker run --rm aperture:ci sh -c 'aperture demo --path /tmp/ws >/dev/null && echo "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/list\",\"params\":{}}" | aperture serve -w /tmp/ws -p svc_support_agent --purpose customer_support' > tools.jsonl
          python - <<'PYCHECK'
          import json
          reply = json.loads(open("tools.jsonl").readline())
          names = {tool["name"] for tool in reply["result"]["tools"]}
          assert "context_search" in names and "action_propose" in names, names
          print("MCP tools available in the container:", len(names))
          PYCHECK

      - name: Collect logs on failure
        if: failure()
        run: docker logs aperture-ci || true

      - name: Stop
        if: always()
        run: docker rm -f aperture-ci || true

  postgres-backend:
    name: postgres backend
    runs-on: ubuntu-latest
    # The multi-host store is only meaningful if it is exercised against a real
    # database. A skipped backend is a backend that does not work.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: aperture
          POSTGRES_USER: aperture
          POSTGRES_DB: aperture_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APERTURE_TEST_POSTGRES_DSN: postgresql://aperture:aperture@localhost:5432/aperture_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,postgres]"

      - name: Both backends must satisfy the same contract
        run: python -m pytest tests/test_store_backends.py -q -rs

      - name: The Postgres claim must admit exactly one winner
        run: |
          set -euo pipefail
          python - <<'PYCHECK'
          import os
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timezone

          from aperture.actions.postgres_store import PostgresActionStore
          from aperture.actions.store import new_proposal_id
          from aperture.actions.types import BlastRadius, Proposal, ProposalState

          dsn = os.environ["APERTURE_TEST_POSTGRES_DSN"]

          # Every "worker" gets its own connection, the way separate machines would.
          stores = [PostgresActionStore(dsn) for _ in range(8)]
          proposal = Proposal(
              id=new_proposal_id(),
              created_at=datetime.now(timezone.utc),
              principal_id="svc_support_agent",
              purpose="customer_support",
              action_id="support.refund",
              arguments={"amount": 50.0},
              arguments_hash="h",
              blast=BlastRadius(summary="Refund 50 USD", amount=50.0, reversible=True),
              state=ProposalState.READY,
              requires_approval=False,
          )
          stores[0].save_proposal(proposal)

          with ThreadPoolExecutor(max_workers=8) as pool:
              won = list(pool.map(lambda s: s.claim_for_execution(proposal.id), stores))

          assert won.count(True) == 1, won
          print("8 independent connections raced one approval; winners:", won.count(True))
          for store in stores:
              store.close()
          PYCHECK
